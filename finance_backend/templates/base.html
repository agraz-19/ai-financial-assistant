<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Financial Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/app.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-semibold text-decoration-none" href="{% url 'home' %}">AI Financial Assistant</a>
        <div class="ms-auto d-flex gap-3">
          <a class="text-white-50 text-decoration-none" href="{% url 'home' %}">Dashboard</a>
          <a class="text-white-50 text-decoration-none" href="{% url 'upload_statement' %}">Upload</a>
          <a class="text-white-50 text-decoration-none" href="{% url 'chat' %}">Chat</a>
          {% if user.is_authenticated %}
            <a class="text-white-50 text-decoration-none" href="{% url 'logout' %}">Logout</a>
          {% else %}
            <a class="text-white-50 text-decoration-none" href="{% url 'login' %}">Login</a>
          {% endif %}
        </div>
      </div>
    </nav>
    <main class="container py-5">
      {% if messages and not hide_messages %}
        <div class="mb-4">
          {% for message in messages %}
            <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-{{ message.tags|default:'info' }}{% endif %} mb-2" role="alert">
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>

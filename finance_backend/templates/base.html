<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UPI Finance Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/app.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-semibold text-decoration-none" href="{% url 'home' %}">UPI Finance Tracker</a>
        <div class="ms-auto d-flex gap-3">
          <a class="text-white-50 text-decoration-none" href="{% url 'home' %}">Dashboard</a>
          <a class="text-white-50 text-decoration-none" href="{% url 'upload_statement' %}">Upload</a>
          {% if user.is_authenticated %}
            <a class="text-white-50 text-decoration-none" href="{% url 'logout' %}">Logout</a>
          {% else %}
            <a class="text-white-50 text-decoration-none" href="{% url 'login' %}">Login</a>
          {% endif %}
        </div>
      </div>
    </nav>
    <main class="container py-5">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>

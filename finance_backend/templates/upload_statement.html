{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h3 mb-3">Upload statement</h1>
        <p class="text-muted">Upload a CSV or PDF bank/UPI statement to parse and categorize transactions.</p>

        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}
          <div class="mb-3">
            <input type="file" name="file" class="form-control" accept=".csv,.pdf" required>
          </div>
          <button class="btn btn-dark" type="submit">Upload</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

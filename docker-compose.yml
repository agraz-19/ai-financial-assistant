services:
  backend:
    build:
      context: ./finance_backend
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - ./finance_backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./finance_backend:/app

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app

